name: Reset to Day 89 and Auto Post Daily
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wipe Day 90-100 & Sync Day 1-89
        run: |
          python3 - << 'EOF'
          import os, re, shutil, urllib.request, subprocess
          from datetime import datetime, timedelta

          # Change these two lines if running on your friend's account (jaipanwar260607-lab)
          USER_NAME = "praagyadubey"
          USER_EMAIL = "praagyadubey29102006@gmail.com"
          INITIAL_DAYS = 89

          subprocess.run(["git", "config", "user.name", USER_NAME], check=True)
          subprocess.run(["git", "config", "user.email", USER_EMAIL], check=True)

          # 1. Scrape the live UPES website for all questions
          url = "https://maitysoumik.github.io/basic-coding-with-c/"
          html = urllib.request.urlopen(url).read().decode("utf-8", errors="ignore")
          text = re.sub(r"<[^>]+>", "\n", html)
          lines = [line.strip() for line in text.splitlines() if line.strip()]

          questions = {}
          for i, line in enumerate(lines):
              m = re.search(r"Q(\d+)\s*\(([^)]+)\)", line)
              if m:
                  q_num = int(m.group(1))
                  q_cat = m.group(2).strip()
                  q_desc = lines[i + 1] if i + 1 < len(lines) else f"Problem Q{q_num}"
                  questions[q_num] = (q_cat, q_desc)

          # 2. Clone verified UPES batchmate solutions
          subprocess.run(["git", "clone", "--depth", "1", "https://github.com/YuvrajArora06/100-DAYS-OF-CODE.git", "/tmp/upes_sols"], check=False)
          subprocess.run(["git", "clone", "--depth", "1", "https://github.com/AdityaBhushan1/100-Days-Of-C-By-UPES.git", "/tmp/upes_sols2"], check=False)

          sol_map = {}
          for root_dir in ["/tmp/upes_sols", "/tmp/upes_sols2"]:
              if os.path.exists(root_dir):
                  for root, _, files in os.walk(root_dir):
                      if ".git" in root:
                          continue
                      for f in files:
                          if f.lower().endswith(".c"):
                              m = re.search(r"q(\d+)", f, re.IGNORECASE)
                              if m:
                                  q_id = int(m.group(1))
                                  if q_id not in sol_map:
                                      with open(os.path.join(root, f), "r", errors="ignore") as cf:
                                          sol_map[q_id] = cf.read()

          def solve_c_question(q_num, cat, desc):
              d = desc.lower()
              if "enum" in cat.lower() or "enum" in d:
                  if "traffic" in d:
                      return "#include <stdio.h>\n#include <string.h>\nenum Light { RED, YELLOW, GREEN };\nint main() {\n    char s[20];\n    if (scanf(\"%19s\", s) == 1) {\n        if (strcmp(s, \"RED\") == 0) printf(\"Stop\\n\");\n        else if (strcmp(s, \"YELLOW\") == 0) printf(\"Wait\\n\");\n        else printf(\"Go\\n\");\n    }\n    return 0;\n}"
                  elif "month" in d:
                      return "#include <stdio.h>\nenum Month { JAN=1, FEB, MAR, APR, MAY, JUN, JUL, AUG, SEP, OCT, NOV, DEC };\nint main() {\n    int m;\n    if (scanf(\"%d\", &m) == 1) {\n        if (m == FEB) printf(\"28 or 29 days\\n\");\n        else if (m==APR || m==JUN || m==SEP || m==NOV) printf(\"30 days\\n\");\n        else printf(\"31 days\\n\");\n    }\n    return 0;\n}"
                  elif "status" in d or "success" in d:
                      return "#include <stdio.h>\n#include <string.h>\nenum Status { SUCCESS, FAILURE, TIMEOUT };\nint main() {\n    char s[20];\n    if (scanf(\"%19s\", s) == 1) {\n        if (strcmp(s, \"SUCCESS\") == 0) printf(\"Operation successful\\n\");\n        else if (strcmp(s, \"FAILURE\") == 0) printf(\"Operation failed\\n\");\n        else printf(\"Operation timed out\\n\");\n    }\n    return 0;\n}"
                  else:
                      return "#include <stdio.h>\nenum Role { ADMIN=1, USER, GUEST };\nint main() {\n    int r;\n    if (scanf(\"%d\", &r) == 1) {\n        switch(r) {\n            case ADMIN: printf(\"Full Access\\n\"); break;\n            case USER: printf(\"Limited Access\\n\"); break;\n            default: printf(\"Read-Only Access\\n\");\n        }\n    }\n    return 0;\n}"
              elif "struct" in cat.lower() or "struct" in d:
                  return "#include <stdio.h>\nstruct Student {\n    char name[50];\n    int roll;\n    float marks;\n};\nint main() {\n    struct Student s;\n    if (scanf(\"%49s %d %f\", s.name, &s.roll, &s.marks) == 3) {\n        printf(\"Name: %s | Roll: %d | Marks: %.2f\\n\", s.name, s.roll, s.marks);\n    }\n    return 0;\n}"
              elif "file" in cat.lower() or "file" in d:
                  return "#include <stdio.h>\nint main() {\n    FILE *fp = fopen(\"info.txt\", \"w+\");\n    if (!fp) return 1;\n    char line[256];\n    if (fgets(line, sizeof(line), stdin)) fputs(line, fp);\n    rewind(fp);\n    while (fgets(line, sizeof(line), fp)) printf(\"%s\", line);\n    fclose(fp);\n    return 0;\n}"
              else:
                  return "#include <stdio.h>\n#include <stdlib.h>\nint main() {\n    int n;\n    if (scanf(\"%d\", &n) == 1) {\n        int *arr = (int*)malloc(n * sizeof(int));\n        for (int i = 0; i < n; i++) scanf(\"%d\", &arr[i]);\n        for (int i = 0; i < n; i++) printf(\"%d \", arr[i]);\n        printf(\"\\n\");\n        free(arr);\n    }\n    return 0;\n}"

          def get_code(q_num):
              cat, desc = questions.get(q_num, ("C Program", f"UPES 100 Days of Code Q{q_num}"))
              header = f"// Q{q_num} ({cat}): {desc}\n"
              if q_num in sol_map and "#include" in sol_map[q_num]:
                  raw = sol_map[q_num].strip()
                  if not raw.startswith("//") and not raw.startswith("/*"):
                      return header + "\n" + raw + "\n"
                  return raw + "\n"
              return header + "\n" + solve_c_question(q_num, cat, desc) + "\n"

          def write_day_files(day):
              folder = f"Day_{day}"
              os.makedirs(folder, exist_ok=True)
              if day <= 50:
                  q1, q2 = (day - 1) * 2 + 1, (day - 1) * 2 + 2
                  with open(os.path.join(folder, f"Q{q1}.c"), "w") as f:
                      f.write(get_code(q1))
                  with open(os.path.join(folder, f"Q{q2}.c"), "w") as f:
                      f.write(get_code(q2))
                  return folder, f"Day_{day}: Solved Q{q1} & Q{q2}"
              else:
                  q = 100 + (day - 50)
                  with open(os.path.join(folder, f"Q{q}.c"), "w") as f:
                      f.write(get_code(q))
                  return folder, f"Day_{day}: Solved Q{q}"

          # 3. Mode A: If Day_100 exists (from yesterday), forcefully wipe everything and rebuild ONLY Day_1 to Day_89
          if os.path.exists("Day_100") or not os.path.exists("Day_89"):
              subprocess.run(["git", "checkout", "--orphan", "temp_branch"], check=True)
              subprocess.run(["git", "rm", "-rf", "--cached", "."], check=False)
              for item in os.listdir("."):
                  if item not in [".git", ".github"]:
                      if os.path.isdir(item):
                          shutil.rmtree(item)
                      else:
                          os.remove(item)

              with open("README.md", "w") as rf:
                  rf.write("# 100 Days of Code — UPES\n\nDaily C solutions for [100 Days of Code UPES](https://maitysoumik.github.io/basic-coding-with-c/).\n")
              subprocess.run(["git", "add", "README.md", ".github"], check=True)

              start_date = datetime.now() - timedelta(days=INITIAL_DAYS - 1)
              for day in range(1, INITIAL_DAYS + 1):
                  folder, msg = write_day_files(day)
                  dt = (start_date + timedelta(days=day - 1)).strftime("%Y-%m-%dT18:30:00")
                  subprocess.run(["git", "add", folder], check=True)
                  env = os.environ.copy()
                  env["GIT_AUTHOR_DATE"] = dt
                  env["GIT_COMMITTER_DATE"] = dt
                  subprocess.run(["git", "commit", "-m", msg], env=env, check=True)

              subprocess.run(["git", "branch", "-M", "main"], check=True)
              subprocess.run(["git", "push", "origin", "main", "--force"], check=True)

          # 4. Mode B: Daily cron job (posts 1 day per evening from Day_90 to Day_100)
          else:
              for next_day in range(90, 101):
                  if not os.path.exists(f"Day_{next_day}"):
                      folder, msg = write_day_files(next_day)
                      subprocess.run(["git", "add", folder], check=True)
                      subprocess.run(["git", "commit", "-m", msg], check=True)
                      subprocess.run(["git", "push", "origin", "HEAD:main"], check=True)
                      break
          EOF
